<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3">
<title>청춘묶음</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <button class="brand" data-page="home"><i></i><span>청춘묶음</span></button>
  <nav>
    <button data-page="record">기록</button>
    <button data-page="bundle">묶음</button>
    <button data-page="wall">벽</button>
  </nav>
</header>

<main>
<section id="home" class="page active">
  <div class="home-grid">
    <div class="home-copy">
      <span class="tiny">PHOTO / QUESTION / ANSWER</span>
      <h1>청춘묶음</h1>
      <p>사진 한 장과 질문 하나로 기록을 남겨.</p>
      <button class="black-btn" data-page="record">기록 시작</button>
    </div>
    <div class="home-object" aria-hidden="true">
      <div class="sample-photo"></div><div class="sample-card"></div>
      <span class="obj-num">01</span>
    </div>
  </div>
</section>

<section id="record" class="page">
  <div class="page-head"><div><span class="tiny">01 / RECORD</span><h2>기록</h2></div><button class="text-btn" data-page="home">처음으로</button></div>
  <div id="categoryView">
    <div class="category-grid" id="categoryGrid"></div>
  </div>
  <div id="questionView" class="hidden">
    <div class="sub-head"><button class="back-btn" id="backCategories">← 카테고리</button><div id="selectedCategory"></div></div>
    <div class="subcats" id="subcats"></div>
    <div class="question-stage" id="questionStage"></div>
  </div>
</section>

<section id="bundle" class="page">
  <div class="page-head"><div><span class="tiny">02 / BUNDLE</span><h2>묶음</h2></div><span id="bundleTotal" class="counter"></span></div>
  <div id="folderGrid" class="folder-grid"></div>
</section>

<section id="wall" class="page">
  <div class="page-head"><div><span class="tiny">03 / WALL</span><h2>벽</h2></div><span class="counter">PUBLIC BOARD · DEMO</span></div>
  <div class="wall-wrap">
    <div class="wall-tools"><span>필름을 원하는 위치에 놓아봐.</span><button id="resetWall" class="text-btn">배치 초기화</button></div>
    <div id="wallBoard" class="wall-board"></div>
  </div>
</section>

<section id="settings" class="page">
  <div class="page-head"><div><span class="tiny">SETTINGS</span><h2>설정</h2></div></div>
  <div class="settings-card">
    <label>질문 API 주소<input id="apiBase" value="/api" autocomplete="off"></label>
    <p>질문 생성 연결부만 따로 바꿀 수 있어. 프론트의 나머지 기능과 분리되어 있어.</p>
    <button id="saveSettings" class="black-btn">저장</button>
  </div>
</section>
</main>

<div class="bottom-nav">
  <button data-page="record">기록</button><button data-page="bundle">묶음</button><button data-page="wall">벽</button><button data-page="settings">설정</button>
</div>

<div id="editor" class="modal">
  <div class="modal-card">
    <button class="close" data-close="editor">×</button>
    <div class="editor-grid">
      <div class="polaroid-preview" id="polaroidPreview">
        <div class="develop"></div><div class="preview-photo" id="previewPhoto"><span>PHOTO</span></div>
        <div class="preview-copy"><small id="previewQuestion"></small><strong id="previewAnswer">한 줄로 남겨봐.</strong></div>
      </div>
      <div class="editor-form">
        <span class="tiny">NEW FILM</span><h3>폴라로이드 만들기</h3>
        <label class="upload">사진 선택<input id="photoInput" type="file" accept="image/*"></label>
        <textarea id="answerInput" maxlength="120" placeholder="한 줄로 답해봐."></textarea>
        <div class="filter-row"><button data-filter="normal" class="active">원본</button><button data-filter="bw">흑백</button><button data-filter="warm">따뜻하게</button></div>
        <button id="printBtn" class="black-btn wide">폴라로이드 완성하기</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/api.js"></script>
<script src="/app.js"></script>
</body>
</html>
